<!DOCTYPE html>
<html class="staticrypt-html">
<head>
<meta charset="utf-8" />
<title>Protected Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="cache-control" content="no-cache" />
<style>
:root{--bg:#0a0a0a;--fg:#e8e8e8;--muted:#888;--accent:#00d4aa;--card:#141414;--border:#222;--input-bg:#1a1a1a}
*{box-sizing:border-box}
.staticrypt-hr{margin:20px 0;border:0;border-top:1px solid var(--border)}
.staticrypt-page{width:380px;padding:12% 0 0;margin:auto}
.staticrypt-form{background:var(--card);max-width:380px;margin:0 auto 100px;padding:40px;text-align:center;border-radius:12px;border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,0.4);color:var(--fg)}
.staticrypt-form input[type="password"],input[type="text"]{background:inherit;border:0;font-size:14px;outline:0;padding:15px 30px 15px 15px;width:100%;color:var(--fg)}
.staticrypt-password-container{position:relative;background:var(--input-bg);width:100%;border:1px solid var(--border);border-radius:8px;margin:0 0 15px}
.staticrypt-toggle-password-visibility{cursor:pointer;height:20px;opacity:.6;padding:13px;position:absolute;right:0;top:50%;transform:translateY(-50%);width:20px;filter:invert(80%)}
.staticrypt-form .staticrypt-decrypt-button{text-transform:uppercase;outline:0;background:var(--accent);width:100%;border:0;border-radius:8px;padding:15px;color:#000;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:8px}
.staticrypt-form .staticrypt-decrypt-button:hover{filter:brightness(110%)}
.staticrypt-html{height:100%}
.staticrypt-body{height:100%;margin:0}
.staticrypt-content{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--fg)}
.staticrypt-instructions{margin-bottom:1em;color:var(--muted)}
.staticrypt-title{font-size:1.4em;font-weight:700;color:#fff;margin-bottom:8px}
.staticrypt-title::before{content:"Zukkin.";display:block;font-size:1.6rem;color:var(--accent);margin-bottom:12px;letter-spacing:-1px}
label.staticrypt-remember{display:flex;align-items:center;margin-bottom:.5em;font-size:13px;color:var(--muted)}
.staticrypt-remember input[type="checkbox"]{transform:scale(1.3);margin-right:.8em;accent-color:var(--accent)}
.hidden{display:none !important}
.staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid var(--border);border-right-color:var(--accent);border-radius:50%;animation:spinner-border .75s linear infinite}
@keyframes spinner-border{100%{transform:rotate(360deg)}}
@media screen and (-webkit-min-device-pixel-ratio:0){.staticrypt-form input[type="password"],input[type="text"]{font-size:16px}}
</style>
</head>
